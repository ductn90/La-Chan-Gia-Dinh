<html lang="vi">

    <meta charset="UTF-8" />

    <meta name="description" content="Trợ lý AI bảo vệ người cao tuổi và gia đình khỏi tin nhắn, cuộc gọi và hình ảnh lừa đảo trực tuyến." />

  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration skipped or failed:', err);
          });
        });
      }
    </script>
